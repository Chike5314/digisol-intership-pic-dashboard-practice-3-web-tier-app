<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIGISOL Group | Internship Gallery</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <i class="fa-solid fa-camera-retro brand-icon"></i>
        <span>DIGISOL <span class="highlight">Internship Gallery</span></span>
      </div>
      <div class="nav-actions">
        <button id="refresh-btn" class="btn btn-secondary" onclick="fetchPhotos()">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh
        </button>
        <button class="btn btn-primary" onclick="openModal()">
          <i class="fa-solid fa-cloud-arrow-up"></i> Add Photo
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    <div class="page-header">
      <div>
        <h1>Internship Photo Records</h1>
        <p class="subtitle">CRUD Operations test bench connecting API Gateway to S3 & DynamoDB.</p>
      </div>
      <span id="photo-count" class="badge">0 photos</span>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <!-- Photo Grid -->
    <div id="photo-grid" class="photo-grid">
      <!-- Skeleton Loading Cards -->
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>
  </main>

  <!-- Modal for Creating/Editing Photo Records -->
  <div id="photo-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Edit Photo Record</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="photo-form" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="form-photo-id" />
        
        <div class="form-group">
          <label for="form-name">Picture Name / Title</label>
          <input type="text" id="form-name" placeholder="e.g., AWS Serverless Architecture Demo" required />
        </div>

        <div class="form-group">
          <label for="form-url">S3 Image URL (`img_url`)</label>
          <input type="url" id="form-url" placeholder="https://your-bucket.s3.amazonaws.com/internship-pic.jpg" required />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load Config First, then App logic -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
